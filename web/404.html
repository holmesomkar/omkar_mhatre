<!DOCTYPE html>
<!--
  GitHub Pages serves this file for any unknown path. Since this is a
  single-page Flutter app with GoRouter-driven section paths (e.g.
  /omkar_mhatre/experience), a direct hit or page refresh on one of those
  paths otherwise 404s — there's no server to route it. This redirects
  back to index.html with the intended path packed into the query string;
  index.html unpacks it before the app boots.
  See: https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omkar Mhatre — Senior Flutter Developer</title>
  <script>
    var pathSegmentsToKeep = 1; // number of segments in the base href, e.g. /omkar_mhatre/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
