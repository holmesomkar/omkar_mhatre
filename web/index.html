  <!--
    GitHub Pages serves this app as static files, so a direct hit or
    refresh on a deep link like /omkar_mhatre/experience would 404 (there's
    no server-side router). web/404.html redirects those requests back here
    with the intended path encoded in the query string; this decodes it
    back into a real URL before Flutter (and GoRouter) boots, so deep links
    and refreshes on any section keep working.
    See: https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
